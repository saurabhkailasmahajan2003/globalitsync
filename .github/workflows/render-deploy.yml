name: Deploy to Render

on:
  push:
    branches:
      - main # Change this to your default branch if it's different (e.g., master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy with Clear Cache
        run: |
          # The RENDER_DEPLOY_HOOK secret should contain the base Deploy Hook URL from Render.
          # We append &clearCache=true to the URL to force a cache clear on deployment.
          if [[ "${{ secrets.RENDER_DEPLOY_HOOK }}" == *"?"* ]]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&clearCache=true"
          else
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}?clearCache=true"
          fi
